<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calm News</title>
<style>
  :root {
    --bronze: #8C6B3F;
    --charcoal: #2b2b2b;
    --grey: #777;
    --hairline: #d9d2c7;
    --bg: #faf8f4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Times New Roman', Times, Georgia, serif;
    background: var(--bg);
    color: var(--charcoal);
    line-height: 1.5;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 40px 24px 80px; }
  header { text-align: center; margin-bottom: 8px; }
  h1 {
    font-weight: bold;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-size: 26px;
  }
  .rule { width: 120px; height: 2px; background: var(--bronze); margin: 12px auto; }
  .subtitle { font-style: italic; color: var(--grey); font-size: 15px; margin-bottom: 28px; text-align: center; }
  nav { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  nav button {
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--hairline);
    color: var(--charcoal);
    padding: 6px 16px;
    cursor: pointer;
  }
  nav button.active { border-color: var(--bronze); color: var(--bronze); font-weight: bold; }
  .statusbar {
    text-align: center;
    font-style: italic;
    color: var(--grey);
    font-size: 13px;
    margin: 14px 0 26px;
    min-height: 18px;
  }
  .statusbar .shield { color: var(--bronze); font-style: normal; }
  .article {
    padding: 18px 4px;
    border-bottom: 1px solid var(--hairline);
  }
  .article .meta {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--bronze);
    margin-bottom: 4px;
  }
  .article .meta .time { color: var(--grey); letter-spacing: 0.05em; text-transform: none; font-style: italic; }
  .article h2 { font-size: 19px; font-weight: bold; line-height: 1.3; }
  .article h2 a { color: var(--charcoal); text-decoration: none; }
  .article h2 a:hover { color: var(--bronze); }
  .article p { font-size: 15px; color: #4a4a4a; margin-top: 6px; }
  .empty, .loading { text-align: center; font-style: italic; color: var(--grey); padding: 60px 0; }
  .controls { text-align: center; margin-top: 40px; font-size: 13px; color: var(--grey); }
  .controls input {
    font-family: inherit;
    font-size: 13px;
    border: 1px solid var(--hairline);
    background: #fff;
    padding: 5px 10px;
    width: 320px;
    max-width: 90%;
    color: var(--charcoal);
  }
  .controls label { display: block; margin-bottom: 6px; font-style: italic; }
  footer {
    margin-top: 60px;
    padding-top: 12px;
    border-top: 1px solid var(--hairline);
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--grey);
    font-style: italic;
  }
  .refresh {
    display: block;
    margin: 24px auto 0;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--bronze);
    color: var(--bronze);
    padding: 8px 24px;
    cursor: pointer;
  }
  .refresh:hover { background: var(--bronze); color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Calm News</h1>
    <div class="rule"></div>
    <div class="subtitle">The day's headlines, minus the noise</div>
  </header>

  <nav id="tabs"></nav>
  <div class="statusbar" id="status"></div>
  <div id="feed"><div class="loading">Loading headlines&hellip;</div></div>
  <button class="refresh" onclick="loadAll()">Refresh</button>

  <div class="controls">
    <label for="blocklist">Filtered words (comma-separated — edit to taste):</label>
    <input id="blocklist" type="text">
  </div>

  <footer><span>Confidential</span><span>Calm News · Page 1</span></footer>
</div>

<script>
const FEEDS = [
  { id: 'bbc',  name: 'BBC',  url: 'https://feeds.bbci.co.uk/news/rss.xml' },
  { id: 'nyt',  name: 'NYT',  url: 'https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml' },
  { id: 'wsj',  name: 'WSJ',  url: 'https://feeds.content.dowjones.io/public/rss/RSSWorldNews' },
  { id: 'cnn',  name: 'CNN',  url: 'http://rss.cnn.com/rss/cnn_topstories.rss' },
];
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
];
const DEFAULT_BLOCK = 'trump';

let allItems = [];
let filteredCount = 0;
let activeTab = 'all';

const $ = id => document.getElementById(id);

function getBlockTerms() {
  return $('blocklist').value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
}

function loadBlocklist() {
  let saved = null;
  try { saved = localStorage.getItem('calmnews-block'); } catch (e) {}
  $('blocklist').value = saved || DEFAULT_BLOCK;
}

function saveBlocklist() {
  try { localStorage.setItem('calmnews-block', $('blocklist').value); } catch (e) {}
}

function isBlocked(item, terms) {
  const text = ((item.title || '') + ' ' + (item.desc || '')).toLowerCase();
  return terms.some(t => text.includes(t));
}

function stripHtml(s) {
  const d = document.createElement('div');
  d.innerHTML = s || '';
  return d.textContent.trim();
}

async function fetchFeed(feed) {
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy(feed.url));
      if (!res.ok) continue;
      const text = await res.text();
      const doc = new DOMParser().parseFromString(text, 'text/xml');
      if (doc.querySelector('parsererror')) continue;
      return [...doc.querySelectorAll('item')].map(it => ({
        source: feed.name,
        sourceId: feed.id,
        title: stripHtml(it.querySelector('title')?.textContent),
        desc: stripHtml(it.querySelector('description')?.textContent).slice(0, 220),
        link: it.querySelector('link')?.textContent?.trim() || '',
        date: new Date(it.querySelector('pubDate')?.textContent || 0),
      }));
    } catch (e) { /* try next proxy */ }
  }
  return null; // feed failed
}

function timeAgo(d) {
  if (!d || isNaN(d)) return '';
  const m = Math.round((Date.now() - d.getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + ' hr ago';
  return Math.round(h / 24) + ' d ago';
}

function render() {
  const terms = getBlockTerms();
  let items = allItems.filter(i => activeTab === 'all' || i.sourceId === activeTab);
  const before = items.length;
  items = items.filter(i => !isBlocked(i, terms));
  filteredCount = before - items.length;
  items.sort((a, b) => b.date - a.date);

  const feedEl = $('feed');
  if (!items.length) {
    feedEl.innerHTML = '<div class="empty">Nothing to show — enjoy the quiet.</div>';
  } else {
    feedEl.innerHTML = items.map(i => `
      <div class="article">
        <div class="meta">${i.source} &nbsp;<span class="time">${timeAgo(i.date)}</span></div>
        <h2><a href="${i.link}" target="_blank" rel="noopener">${i.title}</a></h2>
        ${i.desc ? `<p>${i.desc}</p>` : ''}
      </div>`).join('');
  }
  $('status').innerHTML = filteredCount > 0
    ? `<span class="shield">&#10022;</span> ${filteredCount} stor${filteredCount === 1 ? 'y' : 'ies'} quietly set aside for your peace of mind`
    : 'All clear today';
}

function renderTabs(failed) {
  const tabs = [{ id: 'all', name: 'All' }, ...FEEDS];
  $('tabs').innerHTML = tabs.map(t =>
    `<button class="${t.id === activeTab ? 'active' : ''}" onclick="setTab('${t.id}')">${t.name}${failed && failed.includes(t.id) ? ' &times;' : ''}</button>`
  ).join('');
}

function setTab(id) {
  activeTab = id;
  renderTabs(window._failedFeeds);
  render();
}

async function loadAll() {
  $('feed').innerHTML = '<div class="loading">Loading headlines&hellip;</div>';
  $('status').textContent = '';
  const results = await Promise.all(FEEDS.map(fetchFeed));
  allItems = [];
  const failed = [];
  results.forEach((r, i) => {
    if (r === null) failed.push(FEEDS[i].id);
    else allItems.push(...r);
  });
  window._failedFeeds = failed;
  renderTabs(failed);
  render();
  if (failed.length) {
    $('status').innerHTML += ` &nbsp;·&nbsp; <span style="color:#a05a2c">could not reach: ${failed.map(f => f.toUpperCase()).join(', ')}</span>`;
  }
}

$('blocklist').addEventListener('input', () => { saveBlocklist(); render(); });

loadBlocklist();
renderTabs();
loadAll();
</script>
</body>
</html>
